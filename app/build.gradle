plugins {
    id 'com.android.application'
}

android {
    namespace 'org.Allah_Clock_Live_Wallpaper'
    compileSdk 36

    defaultConfig {
        applicationId "org.Allah_Clock_Live_Wallpaper"

        // 23 is the floor for the current Google Mobile Ads SDK (25.x),
        // the UMP consent SDK (4.x) and modern AndroidX libraries.
        minSdk 23
        // 36 = Android 16. Required by Google Play for app updates since 31 Aug 2026.
        targetSdk 36

        // IMPORTANT: raise versionCode above whatever is currently live on Google Play,
        // otherwise Play Console rejects the upload.
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit true
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            // Keep the debug build fast and readable; R8 is exercised by the release build.
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0',
                    'META-INF/*.kotlin_module'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {

    // ---- AndroidX -----------------------------------------------------------------
    // material / constraintlayout / spinKit were removed: nothing in res/ or java/ uses them.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // ---- Ads (AdMob + mandatory UMP consent) --------------------------------------
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // ---- Images -------------------------------------------------------------------
    // Glide 4.16.0 is the last 4.x; Glide 5 changes RequestOptions/BaseRequestOptions
    // and would need a separate migration pass.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // ---- JSON ---------------------------------------------------------------------
    implementation 'com.google.code.gson:gson:2.14.0'

    // ---- Wallpaper download -------------------------------------------------------
    // okio is intentionally NOT pinned: okhttp pulls the matching version itself.
    // The abandoned com.liulishuo.filedownloader + cn.dreamtobe connector were removed
    // (unused, and they dragged in an old conflicting okhttp3).
    implementation 'com.liulishuo.okdownload:okdownload:1.0.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ---- Colour picker dialog (used by EditorActivity) ----------------------------
    implementation 'com.github.QuadFlask:colorpicker:0.0.14'
}
