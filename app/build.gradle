plugins {
    id 'com.android.application'
}

android {
    namespace 'org.Allah_Clock_Live_Wallpaper'
    compileSdk 36

    defaultConfig {
        applicationId "org.Allah_Clock_Live_Wallpaper"

        // 23 is the floor for the current Google Mobile Ads SDK (25.x),
        // the UMP consent SDK (4.x) and modern AndroidX libraries.
        minSdk 23
        // 36 = Android 16. Required by Google Play for app updates since 31 Aug 2026.
        targetSdk 36

        // IMPORTANT: raise versionCode above whatever is currently live on Google Play,
        // otherwise Play Console rejects the upload.
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            // Must stay false: the app ships an in-app language switcher (English / Arabic).
            // With language splits on, Play delivers only the device's own languages, so an
            // English-only phone would install without values-ar and the switch to Arabic
            // would silently fall back to English. Density and ABI splits are still safe.
            enableSplit false
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            // proguard-android-optimize.txt (not plain proguard-android.txt): the same platform
            // keep rules plus R8's optimiser. No class in this app is loaded by name and no
            // resource is looked up with getIdentifier(), so nothing needs the blanket
            // "keep everything" rule that made minifyEnabled/shrinkResources a no-op before.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            // Keep the debug build fast and readable; R8 is exercised by the release build.
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0',
                    'META-INF/*.kotlin_module'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {

    // ---- AndroidX -----------------------------------------------------------------
    // material / constraintlayout / spinKit were removed: nothing in res/ or java/ uses them.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // ---- Ads (AdMob + mandatory UMP consent) --------------------------------------
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // ---- Images -------------------------------------------------------------------
    // Glide 4.16.0 is the last 4.x; Glide 5 changes RequestOptions/BaseRequestOptions
    // and would need a separate migration pass.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // ---- JSON ---------------------------------------------------------------------
    // Only used by TinyDB to persist the selected clock model as a preference.
    implementation 'com.google.code.gson:gson:2.14.0'

    // ---- Wallpaper catalogue -------------------------------------------------------
    // Every wallpaper ships inside the APK (res/drawable-nodpi), so no download library
    // is needed any more: okdownload / okhttp / filedownloader were all removed.

    // ---- Colour picker dialog (used by EditorActivity) ----------------------------
    implementation 'com.github.QuadFlask:colorpicker:0.0.14'
}
