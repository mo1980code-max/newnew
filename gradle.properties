# Project-wide Gradle settings.
#
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

android.useAndroidX=true
# Still required: com.github.QuadFlask:colorpicker:0.0.14 and
# com.liulishuo.okdownload:1.0.7 are published against the legacy android.support.* APIs.
android.enableJetifier=true

# Give the daemon enough head-room for R8 + resource shrinking.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
